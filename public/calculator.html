<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="styles.css" rel="stylesheet">
        <title>CS370 Final Project</title>
    </head>

    <body>
        <div class="navbar">
            <a href="index.html"><div class="navbutton">Home</div></a>
            <a href="calculator.html"><div class="navbutton">Calculator</div></a>
            <a href="contact.html"><div class="navbutton">Contact</div></a>
        </div>

        <div id="calcContainer">
            <div id="calculator">
                
                <h2>Calculator</h2>
                
                <h5 class="imageContainer" id="result">Please enter an input.</h5>
                <div id="entry">
                    <input type="number" id="numEntry"/>
                    <button id="numConfirm">Enter</button>
                    <button id="calculate">Go!</button>
                </div>
                <div id="math">
                    <button id="plus" class="mathButton">+</button>
                    <button id="minus" class="mathButton">-</button>
                    <button id="multiply" class="mathButton">×</button>
                    <button id="divide" class="mathButton">÷</button>
                </div>
                <img src="images/calculator.png" alt="Image of a calculator" width="50%">
            </div>
        </div>
        <div class="root"></div>

        <script src="https://unpkg.com/react@16/umd/react.production.min.js" crossorigin></script>
        <script src="https://unpkg.com/react-dom@16/umd/react-dom.production.min.js" crossorigin></script>
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
        <!--Code from https://www.youtube.com/watch?v=YnrgTBdhgV4-->
        <script type="text/babel" src="component.js"></script>
        <script type="text/babel">
            ReactDOM.render(<Component />, document.querySelector(".root"));
        </script>

        <script src="calculator.js"></script>
    </body>
</html>
