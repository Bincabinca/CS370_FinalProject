<!DOCTYPE html>

    <body>
        <div class="navbar">

            <a href="calculator.html"><div class="navbutton">Calculator</div></a>
            <a href="contact.html"><div class="navbutton">Contact</div></a>
        </div>
        
        <h2 style="text-align:center;" id="contact-form">Contact Form</h2>
        <form style="text-align:center;" action="/api/contact" method="post"> <!-- Updated to use an API route -->
            Name:<br>
            <input type="text" name="name" required><br>
            Email:<br>
            <input type="email" name="email" required><br>
            Message:<br>
            <textarea name="message" rows="4" cols="50" required></textarea><br><br>

            <input type="submit" value="Send" class="button">
            <input type="reset" value="Clear" class="button">

            <div id="banner">Message sent to the void!</div>
        </form>
    </body>
</html>
